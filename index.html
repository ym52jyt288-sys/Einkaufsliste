    <div class="knopfreihe"><button type="button" class="knopf" id="kOk" disabled>${t`Standort übernehmen`}</button></div>`, { voll: true });
  b._beimSchliessen = nachher;
  const status = t => { $('#kStatus', b).textContent = t; };
  try { await ladeLeaflet(); } catch (e) { return status(t`Die Karte konnte nicht geladen werden. Bitte Internetverbindung prüfen.`); }
  if (!b.isConnected) return;

  const karte = L.map($('#karte', b), { zoomControl: false }).setView(p.ort ? [p.ort.lat, p.ort.lon] : [51.16, 10.45], p.ort ? 17 : 6);
  karte.attributionControl.setPrefix(false);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(karte);
  b._beimSchliessen = () => { karte.remove(); nachher(); };
  setTimeout(() => karte.invalidateSize(), 260);
  const akzent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const marktEbene = L.layerGroup().addTo(karte);
  let wahl = null, nadel = null;

  const setzeWahl = (lat, lon, markt = null) => {
    wahl = { lat, lon, markt };
    if (nadel) nadel.setLatLng([lat, lon]);
    else nadel = L.marker([lat, lon], { interactive: false, icon: L.divIcon({ className: 'nadel', html: '<span></span>', iconSize: [26, 26], iconAnchor: [13, 30] }) }).addTo(karte);
    const standardName = ['Neuer Laden', 'Laden', 'Supermarkt', 'Drogerie'].some(n => p.name === n || p.name === t(n));
    $('#kWahl', b).innerHTML = markt
      ? `<p style="margin:12px 0 0"><strong>${esc(markt.name)}</strong>${markt.adresse ? `<br><span class="text-muted">${esc(markt.adresse)}</span>` : ''}</p>
         <label class="schalter"><div>${t`Namen übernehmen`}<small>${esc(markt.vorschlag)}</small></div><input type="checkbox" id="kName"${standardName ? ' checked' : ''}></label>`
      : `<p class="text-muted" style="margin:12px 0 0">${t`Nadel gesetzt. Tippe auf einen Markt-Punkt, um auch den Namen zu übernehmen.`}</p>`;
    $('#kOk', b).disabled = false;
  };
  if (p.ort) setzeWahl(p.ort.lat, p.ort.lon);
  karte.on('click', e => setzeWahl(e.latlng.lat, e.latlng.lng));

  // Märkte im sichtbaren Ausschnitt nachladen (erst ab Zoomstufe 14, nicht erneut für schon geladene Bereiche)
  let timer, geladen = null, anfrage = 0;
  const ladeMaerkte = () => {
    clearTimeout(timer);
    if (karte.getZoom() < 14) return status(t`Zum Anzeigen der Märkte näher heranzoomen oder oben suchen.`);
    if (geladen && geladen.contains(karte.getBounds())) return;
    timer = setTimeout(async () => {
      const g = karte.getBounds().pad(0.3), nr = ++anfrage;
      status(t`Märkte werden gesucht …`);
      try {
        const liste = await sucheMaerkte({ s: g.getSouth().toFixed(5), w: g.getWest().toFixed(5), n: g.getNorth().toFixed(5), e: g.getEast().toFixed(5) });
        if (nr !== anfrage || !b.isConnected) return;
        geladen = g;
        marktEbene.clearLayers();
        for (const m of liste) {
          L.circleMarker([m.lat, m.lon], { radius: 9, color: '#fff', weight: 2, fillColor: akzent, fillOpacity: 1 })
            .bindTooltip(m.name, { permanent: liste.length <= 30, direction: 'top', offset: [0, -8], className: 'markt-name' })
            .on('click', e => { L.DomEvent.stopPropagation(e); setzeWahl(m.lat, m.lon, m); })
            .addTo(marktEbene);
        }
        status(liste.length === 1 ? t`1 Markt: Punkt antippen oder Nadel per Tippen auf die Karte setzen.`
          : liste.length ? t`${liste.length} Märkte: Punkt antippen oder Nadel per Tippen auf die Karte setzen.`
          : t`Hier keine Märkte gefunden. Nadel per Tippen auf die Karte setzen.`);
      } catch (e) {
        if (nr === anfrage) status(t`Märkte gerade nicht abrufbar. Nadel per Tippen auf die Karte setzen.`);
      }
    }, 600);
  };
  karte.on('moveend', ladeMaerkte);
  if (p.ort) ladeMaerkte();
  else {
    status(t`Standort wird bestimmt …`);
    standort().then(pos => { if (b.isConnected && !wahl) karte.setView([pos.coords.latitude, pos.coords.longitude], 16); })
      .catch(() => status(t`Adresse oder Markt oben suchen, oder die Karte verschieben und heranzoomen.`));
  }

  // Suche nach Adresse oder Marktname
  let treffer = [];
  b.addEventListener('submit', async e => {
    if (e.target.id !== 'kSuche') return;
    e.preventDefault();
    const q = $('#kSuchText', b).value.trim();
    if (!q) return;
    $('#kSuchText', b).blur();
    const ul = $('#kTreffer', b);
    ul.hidden = false;
    ul.innerHTML = '<li><span class="laedt"></span>' + t`Suche …` + '</li>';
    const g = karte.getBounds();
    const d = await holeJSON(`https://nominatim.openstreetmap.org/search?${new URLSearchParams({
      q, format: 'jsonv2', addressdetails: 1, limit: 6, 'accept-language': SPRACHE, viewbox: [g.getWest(), g.getNorth(), g.getEast(), g.getSouth()].join() })}`, 8000);
    if (!b.isConnected) return;
    if (!d) { ul.innerHTML = `<li class="text-muted">${t`Suche gerade nicht erreichbar`}</li>`; return; }
    treffer = d.map(x => {
      const markt = maerkteAusNominatim([x])[0] || null;
      return { lat: +x.lat, lon: +x.lon, titel: x.name || x.display_name.split(',')[0], markt,
        text: markt && markt.adresse ? markt.adresse : x.display_name.split(',').slice(1, 4).join(',').trim() };
    });
    ul.innerHTML = treffer.length ? treffer.map((t, i) => `<li><button type="button" data-treffer="${i}">${esc(t.titel)}<small>${esc(t.text)}</small></button></li>`).join('')
      : `<li class="text-muted">${t`Nichts gefunden`}</li>`;
  });
  b.addEventListener('click', e => {
    const tr = e.target.closest('[data-treffer]');
    if (tr) {
      const x = treffer[+tr.dataset.treffer];
      $('#kTreffer', b).hidden = true;
      karte.setView([x.lat, x.lon], 17);
      setzeWahl(x.lat, x.lon, x.markt);
      return;
    }
    if (e.target.closest('#kOk') && wahl) {
      p.ort = { lat: wahl.lat, lon: wahl.lon, genau: null, quelle: 'karte', adresse: wahl.markt ? wahl.markt.adresse || wahl.markt.name : '' };
      if (wahl.markt && $('#kName', b) && $('#kName', b).checked) p.name = wahl.markt.vorschlag;
      sichereProfile();
      schliesseBlatt(b);
      zeigeToast(t`Standort gespeichert: ${p.name}`);
    }
  });
}

function standort() {
  return new Promise((ok, fehler) => {
    if (!navigator.geolocation) return fehler(new Error('keine Geolocation'));
    navigator.geolocation.getCurrentPosition(ok, fehler, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  });
}
function entfernungMeter(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
async function waehleLadenPerStandort(mitMeldung) {
  if (!S.profile.some(p => p.ort)) { if (mitMeldung) zeigeToast(t`Erst bei einem Laden den Standort speichern`); return; }
  try {
    const pos = await standort();
    const hier = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    const treffer = S.profile.filter(p => p.ort).map(p => ({ p, m: entfernungMeter(hier, p.ort) })).sort((a, b) => a.m - b.m)[0];
    if (treffer && treffer.m <= 250) {
      S.aktivesProfil = treffer.p.id; S.einstellungen.ansicht = 'laden';
      sichereProfile(); sichereEinstellungen(); render();
      zeigeToast(t`Laden: ${treffer.p.name}`);
    } else if (mitMeldung) zeigeToast(t`Kein gespeicherter Laden in der Nähe`);
  } catch (e) { if (mitMeldung) zeigeToast(t`Standort nicht verfügbar`); }
}

$('#btnScan').addEventListener('click', oeffneScanner);

function ladeSkript(src) {
  return new Promise((ok, fehler) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = fehler;
    document.head.appendChild(s);
  });
}

// beiQr: Kundenkarte scannen – alle Formate, Text und Format zurückgeben, statt Barcode oder Einladung zu verarbeiten
async function oeffneScanner(beiQr = null) {
  const el = document.createElement('div');
  el.className = 'scanner';
  el.innerHTML = `<video playsinline muted autoplay></video><div class="rahmen${beiQr ? ' quadrat' : ''}"></div>
    <div class="oben"><button type="button" data-zu>${t`Abbrechen`}</button>${beiQr ? '' : `<button type="button" data-hand>${t`Nummer eingeben`}</button>`}</div>
    <div class="unten" id="scanHinweis">${beiQr ? t`Code der Karte in den Rahmen halten` : t`Barcode in den Rahmen halten`}</div>`;
  document.body.appendChild(el);
  const video = $('video', el);
  let stopp = () => {};
  let fertig = false;
  const schliessen = () => { fertig = true; stopp(); el.remove(); };
  el.querySelector('[data-zu]').onclick = schliessen;
  if (!beiQr) el.querySelector('[data-hand]').onclick = () => {
    const ean = prompt(t`EAN-Nummer (unter dem Barcode):`);
    if (ean && /^\d{8,14}$/.test(ean.trim())) { schliessen(); barcodeGefunden(ean.trim()); }
  };
  const gefunden = (code, format) => {
    if (fertig) return;
    if (beiQr) { schliessen(); return beiQr(code, format); }
    const link = linkAus(code);
    if (!link && !/^\d{6,14}$/.test(code)) return;          // anderer QR-Code: weiter suchen
    schliessen();
    link ? verarbeiteLink(link) : barcodeGefunden(code);
  };

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('keine Kamera');
    if ('BarcodeDetector' in window) {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      stopp = () => stream.getTracks().forEach(t => t.stop());
      video.srcObject = stream;
      await video.play();
      const detektor = new BarcodeDetector({ formats: beiQr ? (await BarcodeDetector.getSupportedFormats()).filter(f => CODE_FORMATE[f]) : ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'qr_code'] });
      const schleife = async () => {
        if (fertig) return;
        try { const r = await detektor.detect(video); if (r[0]) return gefunden(r[0].rawValue, r[0].format); } catch (e) {}
        requestAnimationFrame(schleife);
      };
      schleife();
    } else {
      if (!window.ZXing) await ladeSkript('vendor/zxing.min.js');
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, beiQr ? Object.values(CODE_FORMATE).map(f => ZXing.BarcodeFormat[f.zx])
        : [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.QR_CODE]);
      const leser = new ZXing.BrowserMultiFormatReader(hints, 300);
      stopp = () => leser.reset();
      await leser.decodeFromConstraints({ video: { facingMode: 'environment' }, audio: false }, video, r => { if (r) gefunden(r.getText(), formatVon(ZXing.BarcodeFormat[r.getBarcodeFormat()])); });
    }
  } catch (e) {
    $('#scanHinweis', el).textContent = location.protocol === 'https:' || location.hostname === 'localhost'
      ? t`Kamera nicht verfügbar. Zugriff in den Einstellungen erlauben oder Nummer eingeben.`
      : t`Die Kamera geht nur, wenn die App über https geöffnet wird. Nummer eingeben geht trotzdem.`;
  }
}

/* ============================================================
   Kundenkarten (REWE, Lidl, EDEKA …)
   Der Code kommt aus einem Screenshot der Bonus-App oder vom Scan der Plastikkarte. Gespeichert werden nur Inhalt und Format;
   angezeigt wird ein neu erzeugter Code als Vektorgrafik, gestochen scharf in jeder Größe.
   ============================================================ */

const KETTEN = ['REWE', 'Lidl', 'EDEKA', 'Kaufland', 'Aldi', 'Penny', 'Netto', 'Norma', 'Globus', 'dm', 'Rossmann', 'Müller', 'Payback', 'DeutschlandCard'];
const woerterVon = s => norm(s).split(' ').filter(Boolean);

// Karten, deren Kette im Namen des Ladens steht („Rewe Sendlinger Straße“ → REWE). Ganze Wörter, damit „dm“ nicht in „Edmund“ passt.
function kartenFuerLaden(p = aktivesProfil()) {
  const w = new Set(woerterVon(p && p.name));
  return S.karten.filter(k => { const kw = woerterVon(k.kette); return kw.length && kw.every(x => w.has(x)); });
}

// Code-Formate der Kundenkarten. Namen wie beim BarcodeDetector; zx = Name in zxing. Angezeigt werden können die mit „zeichnen“,
// die anderen erkennt die App und sagt dann, dass sie sie nicht darstellen kann (statt „kein Code gefunden“).
// REWE Bonus nutzt einen Aztec-Code, Lidl Plus einen QR-Code, Plastikkarten oft EAN-13 oder Code 128.
const CODE_FORMATE = {
  qr_code: { name: 'QR-Code', zx: 'QR_CODE', zeichnen: true },
  aztec: { name: 'Aztec-Code', zx: 'AZTEC', zeichnen: true },
  data_matrix: { name: 'Data Matrix', zx: 'DATA_MATRIX', zeichnen: true },
  ean_13: { name: 'EAN-13', zx: 'EAN_13', zeichnen: true, strich: true },
  ean_8: { name: 'EAN-8', zx: 'EAN_8', zeichnen: true, strich: true },
  upc_a: { name: 'UPC-A', zx: 'UPC_A', zeichnen: true, strich: true },
  code_128: { name: 'Code 128', zx: 'CODE_128', zeichnen: true, strich: true },
  code_39: { name: 'Code 39', zx: 'CODE_39', zeichnen: true, strich: true },
  pdf417: { name: 'PDF417', zx: 'PDF_417' },
  itf: { name: 'ITF', zx: 'ITF', strich: true },
  codabar: { name: 'Codabar', zx: 'CODABAR', strich: true },
};
const formatVon = zxName => Object.keys(CODE_FORMATE).find(k => CODE_FORMATE[k].zx === zxName) || null;
const kartenFormat = k => k.format || 'qr_code';   // Karten aus der ersten Fassung haben kein Format

// Code aus einem Bild (Screenshot) lesen → { text, format } oder null. Erst in voller Größe (kleine Codes in großen
// Screenshots), dann verkleinert, jeweils auch hell auf dunkel, weil manche Apps im Dunkelmodus den Code invertieren.
async function codeAusBild(datei) {
  const url = URL.createObjectURL(datei);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    if ('BarcodeDetector' in window) {
      try {
        const formate = (await BarcodeDetector.getSupportedFormats()).filter(f => CODE_FORMATE[f]);
        const r = await new BarcodeDetector({ formats: formate }).detect(img);
        if (r[0]) return { text: r[0].rawValue, format: r[0].format };
      } catch (e) {}
    }
    if (!window.ZXing) await ladeSkript('vendor/zxing.min.js');
    const leser = new ZXing.MultiFormatReader();
    leser.setHints(new Map([[ZXing.DecodeHintType.TRY_HARDER, true],
      [ZXing.DecodeHintType.POSSIBLE_FORMATS, Object.values(CODE_FORMATE).map(f => ZXing.BarcodeFormat[f.zx])]]));
    const laenge = Math.max(img.naturalWidth, img.naturalHeight);
    // Ausschnitt (x, y, b, h in Bildpixeln) auf höchstens „kante“ Pixel verkleinert in ein Canvas zeichnen
    const zeichne = (x, y, b, h, kante) => {
      const f = Math.min(1, kante / Math.max(b, h));
      const c = document.createElement('canvas');
      c.width = Math.round(b * f); c.height = Math.round(h * f);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);   // transparente Bilder: weißer Grund
      ctx.drawImage(img, x, y, b, h, 0, 0, c.width, c.height);
      return c;
    };
    const lies = (c, invertiert, l = leser) => {
      // Für jeden Versuch eine neue Quelle: Die Strichcode-Leser drehen sie bei TRY_HARDER in sich selbst
      const q = invertiert ? new ZXing.HTMLCanvasElementLuminanceSource(c).invert() : new ZXing.HTMLCanvasElementLuminanceSource(c);
      try {
        const r = l.decodeWithState(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(q)));
        return { text: r.getText(), format: formatVon(ZXing.BarcodeFormat[r.getBarcodeFormat()]) };
      } catch (e) { if (!(e instanceof ZXing.NotFoundException || e instanceof ZXing.ChecksumException || e instanceof ZXing.FormatException)) throw e; }
      return null;
    };
    const kanten = [...new Set([Math.min(laenge, 2000), 1200].filter(k => k <= laenge))];
    if (!kanten.length) kanten.push(laenge);
    for (const kante of kanten) {
      const c = zeichne(0, 0, img.naturalWidth, img.naturalHeight, kante);
      for (const inv of [false, true]) { const r = lies(c, inv); if (r) return r; }
    }
    // Der Aztec-Leser sucht den Code von der Bildmitte aus. Liegt er in einem hohen Screenshot weiter oben oder unten,
    // findet er ihn nicht: dann überlappende Ausschnitte absuchen, nur nach Aztec (schnell).
    const aztec = new ZXing.MultiFormatReader();
    aztec.setHints(new Map([[ZXing.DecodeHintType.TRY_HARDER, true], [ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.AZTEC]]]));
    const kurz = Math.min(img.naturalWidth, img.naturalHeight);
    for (const [anteil, inverse] of [[1, [false, true]], [0.55, [false]]]) {
      const g = Math.round(kurz * anteil), schritt = Math.max(1, Math.round(g / 3));
      for (let y = 0; y + g <= img.naturalHeight + schritt - 1; y += schritt) {
        await new Promise(ok => setTimeout(ok));   // Oberfläche (Ladekreis) nicht blockieren
        for (let x = 0; x + g <= img.naturalWidth + schritt - 1; x += schritt) {
          const c = zeichne(Math.min(x, img.naturalWidth - g), Math.min(y, img.naturalHeight - g), g, g, 600);
          for (const inv of inverse) { const r = lies(c, inv, aztec); if (r) return r; }
        }
      }
    }
    return null;
  } finally { URL.revokeObjectURL(url); }
}

/* Codes als Vektorgrafik (SVG). QR über qrcode-generator, Aztec und Data Matrix über zxing, Strichcodes selbst kodiert. */
function matrixSvg(breite, hoehe, dunkel, rand) {
  let pfad = '';
  for (let y = 0; y < hoehe; y++) for (let x = 0; x < breite; x++) if (dunkel(x, y)) pfad += `M${x + rand} ${y + rand}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" class="code-2d" viewBox="0 0 ${breite + 2 * rand} ${hoehe + 2 * rand}" shape-rendering="crispEdges">` +
    `<rect width="100%" height="100%" fill="#fff"/><path d="${pfad}" fill="#000"/></svg>`;
}
// Strichcode aus Modulbreiten, abwechselnd Strich und Lücke, beginnend mit einem Strich. Ruhezone 10 Module.
function strichSvg(breiten) {
  const rand = 10, summe = breiten.reduce((a, b) => a + b, 0), hoehe = Math.max(40, Math.round((summe + 2 * rand) * 0.32));
  let x = rand, pfad = '';
  breiten.forEach((b, i) => { if (i % 2 === 0) pfad += `M${x} 0h${b}v${hoehe}h-${b}z`; x += b; });
  return `<svg xmlns="http://www.w3.org/2000/svg" class="code-1d" viewBox="0 0 ${summe + 2 * rand} ${hoehe}" preserveAspectRatio="none" shape-rendering="crispEdges">` +
    `<rect width="100%" height="100%" fill="#fff"/><path d="${pfad}" fill="#000"/></svg>`;
}
const ausBits = bits => bits.replace(/(1+|0+)/g, m => m.length + ',').split(',').filter(Boolean).map(Number);   // '1101' → [2,1,1]

const EAN_L = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'];
const EAN_G = EAN_L.map(c => [...c].reverse().map(b => b === '1' ? '0' : '1').join(''));
const EAN_R = EAN_L.map(c => [...c].map(b => b === '1' ? '0' : '1').join(''));
const EAN_PARITAET = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'];
function eanBits(ziffern) {
  const d = [...ziffern].map(Number);
  if (d.length === 8) return '101' + d.slice(0, 4).map(x => EAN_L[x]).join('') + '01010' + d.slice(4).map(x => EAN_R[x]).join('') + '101';
  const par = EAN_PARITAET[d[0]];
  return '101' + d.slice(1, 7).map((x, i) => (par[i] === 'L' ? EAN_L : EAN_G)[x]).join('') + '01010' + d.slice(7).map(x => EAN_R[x]).join('') + '101';
}
const C128 = ('212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 ' +
  '223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 ' +
  '132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 ' +
  '331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 ' +
  '241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 ' +
  '131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112').split(' ');
// Code 128: reine Ziffern gerader Länge in Zeichensatz C (kompakt), sonst B (druckbares ASCII)
function code128Breiten(text) {
  let werte;
  if (/^(\d\d)+$/.test(text)) werte = [105, ...text.match(/\d\d/g).map(Number)];
  else if (/^[\x20-\x7e]+$/.test(text)) werte = [104, ...[...text].map(c => c.charCodeAt(0) - 32)];
  else throw new Error('Code 128: Zeichen');
  werte.push(werte.reduce((s, w, i) => s + w * (i || 1), 0) % 103, 106);
  return werte.flatMap(w => [...C128[w]].map(Number));
}
const C39 = { 0: '000110100', 1: '100100001', 2: '001100001', 3: '101100000', 4: '000110001', 5: '100110000', 6: '001110000', 7: '000100101',
  8: '100100100', 9: '001100100', A: '100001001', B: '001001001', C: '101001000', D: '000011001', E: '100011000', F: '001011000', G: '000001101',
  H: '100001100', I: '001001100', J: '000011100', K: '100000011', L: '001000011', M: '101000010', N: '000010011', O: '100010010', P: '001010010',
  Q: '000000111', R: '100000110', S: '001000110', T: '000010110', U: '110000001', V: '011000001', W: '111000000', X: '010010001', Y: '110010000',
  Z: '011010000', '-': '010000101', '.': '110000100', ' ': '011000100', '*': '010010100', $: '010101000', '/': '010100010', '+': '010001010', '%': '000101010' };
function code39Breiten(text) {
  if (![...text].every(c => C39[c] && c !== '*')) throw new Error('Code 39: Zeichen');
  return [...('*' + text + '*')].flatMap((c, i) => [...(i ? [1] : []), ...[...C39[c]].map(b => b === '1' ? 3 : 1)]);
}

function codeSvg(text, format) {
  if (format === 'qr_code') return qrSvg(text, 4).replace('class="qr"', 'class="code-2d"');
  if (format === 'aztec' || format === 'data_matrix') {
    const hints = new Map();
    if (format === 'data_matrix') hints.set(ZXing.EncodeHintType.DATA_MATRIX_SHAPE, ZXing.DataMatrixSymbolShapeHint.FORCE_SQUARE);
    const m = format === 'aztec' ? new ZXing.AztecCodeWriter().encode(text, ZXing.BarcodeFormat.AZTEC, 0, 0, hints)
      : new ZXing.DataMatrixWriter().encode(text, ZXing.BarcodeFormat.DATA_MATRIX, 0, 0, hints);
    return matrixSvg(m.getWidth(), m.getHeight(), (x, y) => m.get(x, y), format === 'aztec' ? 2 : 3);
  }
  if (format === 'ean_13' || format === 'ean_8' || format === 'upc_a') {
    const z = format === 'upc_a' ? '0' + text : text;
    if (!/^(\d{13}|\d{8})$/.test(z)) throw new Error('EAN: Ziffern');
    return strichSvg(ausBits(eanBits(z)));
  }
  if (format === 'code_128') return strichSvg(code128Breiten(text));
  if (format === 'code_39') return strichSvg(code39Breiten(text));
  throw new Error('Format nicht darstellbar');
}

// Karte an der Kasse: Vollbild, weiß, großer Code. Die Bildschirmhelligkeit kann eine Web-App nicht ändern;
// sie hält aber das Display wach (Wake Lock), solange die Karte offen ist.
async function zeigeKarte(start = null) {
  if (!S.karten.length) return;
  try { for (const f of new Set(S.karten.map(kartenFormat))) await codeBibliothek(f); } catch (e) { return zeigeToast(t`Der Code konnte nicht geladen werden`); }
  const passend = kartenFuerLaden();
  const reihe = [...passend, ...S.karten.filter(k => !passend.includes(k))];
  let aktiv = start || reihe[0];
  const el = document.createElement('div');
  el.className = 'kartenansicht';
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  const zeichne = () => {
    let code;
    try { code = codeSvg(aktiv.inhalt, kartenFormat(aktiv)); } catch (e) { code = `<p>${t`Dieser Code lässt sich nicht darstellen.`}</p>`; }
    el.innerHTML = `<div class="ka-kopf"><button type="button" data-zu>${t`Fertig`}</button></div>
      ${reihe.length > 1 ? `<div class="ka-reiter">${reihe.map(k => `<button type="button" data-k="${k.id}" class="${k === aktiv ? 'an' : ''}">${esc(k.kette)}${k.name ? ' · ' + esc(k.name) : ''}</button>`).join('')}</div>` : ''}
      <div class="ka-mitte"><h2>${esc(aktiv.kette)}</h2>${aktiv.name ? `<p class="ka-name">${esc(aktiv.name)}</p>` : ''}
        <div class="ka-code${CODE_FORMATE[kartenFormat(aktiv)] && CODE_FORMATE[kartenFormat(aktiv)].strich ? ' strich' : ''}">${code}</div>
        ${aktiv.inhalt.length <= 40 ? `<p class="ka-nummer">${esc(aktiv.inhalt)}</p>` : ''}</div>
      <p class="ka-tipp">${t`Das Display bleibt an. Heller geht es über das Kontrollzentrum.`}</p>`;
  };
  zeichne();
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
  const farbe = $('#themeFarbe'), farbeVorher = farbe.content;
  farbe.content = '#ffffff';
  let sperre = null;
  const wach = async () => { try { if (navigator.wakeLock && document.visibilityState === 'visible') sperre = await navigator.wakeLock.request('screen'); } catch (e) {} };
  const beiSichtbar = () => { if (document.visibilityState === 'visible') wach(); };
  wach();
  document.addEventListener('visibilitychange', beiSichtbar);
  el.addEventListener('click', e => {
    const k = e.target.closest('[data-k]');
    if (k) { aktiv = S.karten.find(x => x.id === k.dataset.k) || aktiv; return zeichne(); }
    if (e.target.closest('[data-zu]')) {
      document.removeEventListener('visibilitychange', beiSichtbar);
      if (sperre) sperre.release().catch(() => {});
      farbe.content = farbeVorher;
      el.remove();
      if (!$('.hinterlegt')) document.body.style.overflow = '';
    }
  });
}

function abteilungAusTags(tags, standard) {
  const alle = (tags || []).join(' ');
  for (const [muster, abt] of OFF_KATEGORIEN) if (alle.includes(muster)) return abt;
  return standard;
}

async function holeJSON(url, ms = 7000, optionen = {}) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { ...optionen, signal: ctrl.signal });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; } finally { clearTimeout(t); }
}

function produktname(p) {
  const marke = gross((p.brands || '').split(',')[0].trim());
  let name = (p['product_name_' + SPRACHE] || p.product_name || p['generic_name_' + SPRACHE] || p.generic_name || '').trim();
  if (marke && name.toLowerCase().includes(marke.toLowerCase())) name = name.replace(new RegExp(marke.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), '').trim();
  const menge = (p.quantity || '').trim();
  return [marke, name, menge].filter(Boolean).join(' ').replace(/\s+/g, ' ');
}

async function sucheProdukt(ean) {
  const felder = `product_name,product_name_${SPRACHE},generic_name,generic_name_${SPRACHE},brands,quantity,categories_tags`;
  const quellen = [
    ['https://world.openfoodfacts.org', null],
    ['https://world.openbeautyfacts.org', 'drogerie'],
    ['https://world.openproductsfacts.org', 'haushalt'],
  ];
  for (const [basis, standard] of quellen) {
    const d = await holeJSON(`${basis}/api/v2/product/${ean}.json?fields=${felder}`);
    if (d && d.status === 1 && d.product) {
      const name = produktname(d.product);
      if (!name) continue;
      const abt = abteilungAusTags(d.product.categories_tags, standard) || klassifiziere(d.product['product_name_' + SPRACHE] || d.product.product_name || name).abt;
      return { name, abt };
    }
  }
  return null;
}

async function barcodeGefunden(ean) {
  const b = oeffneBlatt(`<div class="blatt-kopf"><h3>${t`Barcode ${esc(ean)}`}</h3><button type="button" class="zurueck" data-schliessen>${t`Abbrechen`}</button></div>

const EINHEIT_RE = new RegExp(`^(?:${EINHEITEN.map(e => e.replace('.', '\\.')).join('|')})\\.?(?=\\s|$)`, 'iu');

const REZEPT_GEWICHT = { g: ['g', 1], gr: ['g', 1], gramm: ['g', 1], kg: ['kg', 1], kilo: ['kg', 1],
  ml: ['ml', 1], cl: ['ml', 10], dl: ['ml', 100], l: ['l', 1], liter: ['l', 1], ltr: ['l', 1],

const REZEPT_KUECHE = new RegExp('^(el|tl|essl[öo]ffel|teel[öo]ffel|msp|messerspitzen?|prisen?|zehen?|scheiben?|tassen?|handvoll|zweige?|stiele?|bl[äa]tt(er)?|schuss|spritzer|etwas|cups?|tbsp|tsp|oz|mg'
  + '|tbsps?|tsps?|tbs|tablespoons?|teaspoons?|cloves?|pinch(es)?|dash|slices?|handful|sprigs?|stalks?'
  + '|c|cs|cc|cas|cac|càs|càc|cuill[èe]res?|pinc[ée]es?|gousses?|tranches?|verres?|poign[ée]e|brins?|branches?'
  + '|cucharadas?|cucharaditas?|cdas?|cdtas?|cditas?|pizcas?|dientes?|rodajas?|lonchas?|ramas?|vasos?|puñados?|hojas?)$', 'iu');
const BRUECHE = { '½': 0.5, '¼': 0.25, '¾': 0.75, '⅓': 1 / 3, '⅔': 2 / 3, '⅛': 0.125 };
function rezeptMenge(zeile) {
  const m = zeile.match(/^(?:ca\.?\s*)?(\d+(?:[.,]\d+)?|[½¼¾⅓⅔⅛])(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?\s*([a-zäöüßàâçéèêëîïôûùÿñáíóú]+)?/i);
  if (!m) return null;
  const n = BRUECHE[m[2] || m[1]] ?? parseFloat((m[2] || m[1]).replace(',', '.'));
  const wort = (m[3] || '').toLowerCase();
  if (REZEPT_GEWICHT[wort]) { const [einheit, f] = REZEPT_GEWICHT[wort]; return { menge: Math.round(n * f * 100) / 100, einheit }; }
  if (REZEPT_KUECHE.test(wort)) return null;
  return { menge: Math.max(1, Math.ceil(n)), einheit: 'stk' };
}

// Liefert [{ name, menge, einheit }]; menge ist null, wenn keine einkaufbare Menge dasteht
// Zerlegt den Rezepttext in Zutatenzeilen. Fehlen Zeilenumbrüche (z. B. Live-Text aus einem Foto),
// wird an Aufzählungszeichen, Kommas und vor jeder neuen Mengenangabe getrennt.
function rezeptTeile(text) {
  let t = String(text).replace(/\r/g, '');
  // Alles ab „Zubereitung:“ ist Anleitung – aber nur, wenn davor schon Zutaten stehen (nicht „Zubereitung: 20 Min“ oben im Rezept)
  const anleitung = t.search(/(?:^|\s)(?:zubereitung|anleitung|so geht'?s|instructions|directions|method|preparation|préparation|étapes|preparación|elaboración|instrucciones|pasos)(?=[\s:]|$)\s*:?/i);
  if (anleitung > 0 && /\d/.test(t.slice(0, anleitung))) t = t.slice(0, anleitung);
  t = t.replace(/\([^)]*\)/g, ' ').replace(/(?:^|\s)(?:für|for|pour|para)\s+\d+\s*(?:personen|portionen|stück|stk|people|persons|servings|portions|personnes|parts|personas|raciones|porciones)(?=[\s.,;:]|$)/gi, ' ');
  const zeilen = t.split('\n').filter(z => z.trim());
  const einzeilig = zeilen.length === 1;
  return {
    einzeilig,
    teile: zeilen.flatMap(z => {
      let teile = z.split(/\s[•·▢□☐◦○●✓✔*]\s*|\s[-–—]\s(?=\S)/);
      if (einzeilig) teile = teile.flatMap(x => x.split(/;|(?<!\d),|,(?!\d)/));
      if (einzeilig || z.length > 70) teile = teile.flatMap(x => x.split(/(?<=[^\d\s\-–,.\/])\s+(?=(?:ca\.?\s*)?[\d½¼¾⅓⅔⅛])/));
      return teile;
    }),
  };
}

// „Salz Pfeffer“ ohne Trennzeichen: in einzelne Artikel teilen, wenn jedes Wort für sich ein Katalogbegriff ist
function trenneBekannte(name) {
  const woerter = name.split(/\s+/);
  if (woerter.length < 2 || exakt(kompakt(name))) return [name];
  return woerter.every(w => w.length >= 3 && exakt(kompakt(w))) ? woerter : [name];
}

function parseRezept(text) {
  const { teile, einzeilig } = rezeptTeile(text);
  const aus = [];
  for (let z of teile) {
    z = z.replace(/^[\s•·\-–—*▢□☐◦○●✓✔]+/, '').replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
    if (!z || z.endsWith(':') || z.length > 70) continue;
    if (/^(zutaten|zubereitung|anleitung|schritt|portion|für \d|personen|nährwerte|tipp|dazu|außerdem|ingredients|instructions|directions|method|step|serves|servings|for \d|nutrition|tips?\b|ingrédients|préparation|étape|pour \d|ingredientes|preparación|elaboración|paso|para \d|raciones)/i.test(z)) continue;
    // Zubereitungshinweis ohne Zutat, z. B. der Rest von „Knoblauch, fein gehackt“ im Fließtext
    if (/^(fein|grob|frisch|klein|gehackt|gerieben|gewürfelt|geschnitten|geschält|gepresst|zerdrückt|halbiert|geviertelt|zimmerwarm|in (scheiben|würfel|streifen|ringe)|finely|roughly|chopped|minced|diced|sliced|grated|peeled|crushed|halved|finement|haché|hachée|hachés|émincé|émincée|coupé|coupée|râpé|râpée|pelé|pelée|picado|picada|picados|picadas|rallado|rallada|pelado|pelada|cortado|cortada|troceado|en (dados|rodajas|tiras|cubes|rondelles|lamelles))(?![\p{L}])/iu.test(z)) continue;
    const mg = rezeptMenge(z);
    z = z.split(/(?<!\d),|,(?!\d)/)[0];
    z = z.replace(/\s+((fein|grob|frisch)\s+)?(gehackt|gerieben|gewürfelt|geschnitten|geschält|gepresst|zerdrückt|halbiert)\b.*$/i, '');
    z = z.replace(/\s+((finely|roughly|freshly)\s+)?(chopped|minced|diced|sliced|grated|peeled|crushed|halved)(?![\p{L}]).*$/iu, '');
    z = z.replace(/\s+(finement\s+)?(hach[ée]e?s?|émincée?s?|coupée?s?|râpée?s?|pelée?s?|écrasée?s?)(?![\p{L}]).*$/iu, '');
    z = z.replace(/\s+(finamente\s+)?(picad[oa]s?|rallad[oa]s?|pelad[oa]s?|cortad[oa]s?|trocead[oa]s?)(?![\p{L}]).*$/iu, '');
    z = z.replace(/\b(nach (belieben|geschmack|bedarf)|zum (garnieren|bestreuen|servieren|braten|anbraten)|optional|zum Abschmecken|für die Form)\b.*$/i, '').trim();
    z = z.replace(/(?:^|\s)(to taste|as needed|for garnish|for serving|optional|au goût|selon (le|votre) goût|pour (la )?garniture|facultatif|al gusto|opcional|para decorar|para servir)(?![\p{L}]).*$/iu, '').trim();
    for (let i = 0; i < 6; i++) {
      const vorher = z;
      z = z.replace(/^(ca\.?\s*)?[\d½¼¾⅓⅔⅛.,/\s-]+(?=\D)/, '').trim();
      z = z.replace(/^(?:cuill[èe]res?|c\.?)\s*[àa]\s*(?:soupe|caf[ée]|s\.|c\.)(?=\s|$)/iu, '').trim();   // „c. à soupe“
      z = z.replace(EINHEIT_RE, '').trim();
      z = z.replace(/^(à|a|von|vom|der|die|das|of|de la|de|du|des|del|en)\s+/i, '').replace(/^d['’]\s*/i, '').trim();
      if (z === vorher) break;
    }
    if (!z || /^\d/.test(z) || z.length < 2) continue;
    if (/^(min(uten|utes|utos|\.)?|std\.?|stunden?|hours?|heures?|horas?|kcal|kj|grad|degrees|°)(\s|$)/i.test(z)) continue;
    const namen = z.split(/\s+(?:und|oder|and|or|et|ou|y|o|&)\s+|\s*\/\s*/).map(t => t.trim()).filter(t => t.length >= 2)
      .flatMap(n => einzeilig ? trenneBekannte(n) : [n]);
    for (const name of namen) {
      const mit = namen.length === 1 && mg;
      aus.push({ name, menge: mit ? mg.menge : null, einheit: mit ? mg.einheit : null });
    }
  }
  return aus;
}

// Rezeptzeile → Artikel mit Hauptnamen aus dem Katalog („Knoblauchzehen“ → „Knoblauch“)
function rezeptArtikel(namen) {
  const offenKeys = new Set(offene().map(i => kompakt(i.name)));
  const vorrat = new Set([...VORRAT, ...Object.values(SPRACHPAKETE).flatMap(x => x.vorrat || [])].map(kompakt));
  const gesehen = new Set();
  const aus = [];
  for (const roh of namen) {
    const r = erkenne(roh.name || roh);
    let name = gross((roh.name || roh).trim());
    // Nur bei sicherem Treffer umbenennen; ein Wortende („…saft“) bestimmt nur die Abteilung, nicht den Namen
    if (r && r.ganz && (r.art === 'exakt' || r.art === 'fuzzy')) name = r.e.name;
    const key = kompakt(name);
    if (!key || gesehen.has(key)) continue;
    gesehen.add(key);
    const abt = roh.abteilung && ABT_IDS.includes(roh.abteilung) && !S.korrekturen[key] ? roh.abteilung : klassifiziere(name).abt;
    const grund = offenKeys.has(key) ? t`auf der Liste` : vorrat.has(key) ? t`Vorrat` : '';
    const menge = roh.menge > 0 ? roh.menge : null;
    aus.push({ name, abt, an: !grund, grund, menge, einheit: menge ? (EINHEITEN_MENGE.includes(roh.einheit) ? roh.einheit : 'stk') : null });
  }
  return aus;
}

// Text im Prüfblatt: Menge und Name, z. B. „400 g Spaghetti“
const pruefText = a => `${a.menge && mengeText(a) ? mengeText(a) + ' ' : ''}${a.name}`;

// Geänderten Text übernehmen: Menge aus dem Text lesen, Abteilung neu bestimmen (außer sie wurde von Hand gewählt)
function pruefAendern(a, text) {
  const p = parseMenge(String(text).trim());
  if (!p.name) return false;
  a.name = gross(p.name);
  a.menge = p.explizit ? p.menge : null;
  a.einheit = p.explizit ? p.einheit : null;
  if (!a.abtManuell) a.abt = klassifiziere(a.name).abt;
  return true;
}

  };
}

/* ============================================================
   Gespeicherte Rezepte: abrufen mit #Name
   ============================================================ */

function rezeptSpeichern(name, artikel, ersetzt = null) {
  const key = kompakt(name);
  const vorhanden = S.rezepte.find(x => kompakt(x.name) === key && x !== ersetzt);
  if (vorhanden && !confirm(t`Es gibt schon ein Rezept „#${vorhanden.name}“. Ersetzen?`)) return false;
  S.rezepte = S.rezepte.filter(x => x !== vorhanden);
  S.rezepte.push({ id: uid(), name, zutaten: artikel.map(a => ({
    name: a.name, menge: a.menge || null, einheit: a.menge ? (a.einheit || 'stk') : null, abteilung: a.abt || a.abteilung })) });
  S.rezepte.sort((a, b) => a.name.localeCompare(b.name, SPRACHE));
  sichereRezepte();
  return true;
}

// „#chili“ findet „Chili sin Carne“, wenn es eindeutig ist
function findeRezept(tag) {
  const k = kompakt(String(tag).replace(/^#+/, ''));
  if (!k) return null;
  const genau = S.rezepte.find(x => kompakt(x.name) === k);
  if (genau) return genau;
  const anfang = S.rezepte.filter(x => kompakt(x.name).startsWith(k));
  return anfang.length === 1 ? anfang[0] : null;
}

// Zutaten mehrerer Rezepte zusammenfassen: gleiche Zutat einmal, Mengen gleicher Einheit addiert
function rezeptZutaten(rezepte) {
  const gesamt = new Map();
  for (const z of rezepte.flatMap(x => x.zutaten)) {
    const k = kompakt(z.name), g = gesamt.get(k);
    if (!g) gesamt.set(k, { ...z });
    else if (g.menge && z.menge && g.einheit === z.einheit) g.menge = Math.round((g.menge + z.menge) * 100) / 100;
  }
  return [...gesamt.values()];
}

function rezepteAbrufen(rezepte) {
  oeffnePruefung(rezeptArtikel(rezeptZutaten(rezepte)), { titel: rezepte.map(x => '#' + x.name).join(', '), speichern: false });
}

async function bildAlsJPEG(datei, maxKante = 1568) {
  const url = URL.createObjectURL(datei);
  try {
    const img = await new Promise((ok, fehler) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fehler; i.src = url; });
    const f = Math.min(1, maxKante / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * f); c.height = Math.round(img.naturalHeight * f);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}

  try { d = await antwort.json(); } catch (e) {}
  if (!antwort.ok) {
    const meldung = d && d.error && d.error.message;
    if (antwort.status === 401) throw new Error(t`API-Schlüssel ungültig. Bitte in den Einstellungen prüfen.`);
    if (antwort.status === 429 || antwort.status === 529) throw new Error(t`Claude ist gerade ausgelastet. Bitte gleich noch einmal versuchen.`);
    throw new Error(t`Fehler ${antwort.status}` + (meldung ? ': ' + meldung : ''));
  }
  if (d.stop_reason === 'refusal') throw new Error(t`Die Anfrage wurde abgelehnt. Bitte den Text einfügen.`);
  if (d.stop_reason === 'max_tokens') throw new Error(t`Die Antwort war zu lang. Bitte einen kleineren Ausschnitt fotografieren.`);
  const text = (d.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
  const json = JSON.parse(text);
  return (json.zutaten || []).filter(z => z && z.name);
}

/* ============================================================
   Liste teilen: Snapshot im Link (#l=…), Rückmeldung per Link (#r=…)
   Die Daten stehen im Fragment hinter „#“ und werden nie an den Server geschickt.
   ============================================================ */

const appAdresse = () => location.origin + location.pathname;

function b64url(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
const ausB64url = str => Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const durchStrom = async (bytes, strom) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(strom)).arrayBuffer());

// Erstes Zeichen: z = deflate-komprimiert, j = reines JSON (falls der Browser keinen CompressionStream kennt)
async function kodiere(obj, komprimieren = typeof CompressionStream !== 'undefined') {
  const roh = new TextEncoder().encode(JSON.stringify(obj));
  return komprimieren ? 'z' + b64url(await durchStrom(roh, new CompressionStream('deflate-raw'))) : 'j' + b64url(roh);
}
async function dekodiere(str) {
  const bytes = ausB64url(str.slice(1));
  const roh = str[0] === 'z' ? await durchStrom(bytes, new DecompressionStream('deflate-raw')) : bytes;
  return JSON.parse(new TextDecoder().decode(roh));
}

function linkAus(text) {
  const m = String(text || '').match(/#([lrs])=([A-Za-z0-9_-]{4,})/);
  return m ? { art: m[1], daten: m[2] } : null;
}

function snapshot() {
  const artikel = S.liste.filter(i => !i.erledigt && !i.pausiert);
  return { v: 1, id: uid(), t: Date.now(), a: artikel.map(i => [i.id, i.name, i.menge ?? null, i.einheit || 'stk', i.abteilung, i.notiz || '']) };
}
const ausZeile = ([id, name, menge, einheit, abteilung, notiz]) => ({
  id: String(id), name: String(name), menge, einheit: EINHEITEN_MENGE.includes(einheit) ? einheit : 'stk',
  abteilung: ABT_IDS.includes(abteilung) ? abteilung : 'sonstiges', notiz: notiz || '', erledigt: false, erledigtUm: null,
});

// Standardreihenfolge der Abteilungen, wie im Standardprofil „Supermarkt“
const nachAbteilung = items => standardProfile()[0].reihenfolge.map(abt => [abt, items.filter(i => i.abteilung === abt)]).filter(([, l]) => l.length);
function artikelText(i) {
  const m = mengeText(i);
  return `${m ? m + ' ' : ''}${i.name}${i.notiz ? ` (${i.notiz})` : ''}`;
}

async function teileListe() {
  const snap = snapshot();
  if (!snap.a.length) return zeigeToast(t`Keine offenen Artikel zum Teilen`);
  const items = snap.a.map(ausZeile);
  const text = t`Einkaufsliste (${items.length} Artikel)` + '\n\n'
    + nachAbteilung(items).map(([abt, l]) => `${ABT_NAME[abt]}\n${l.map(i => '- ' + artikelText(i)).join('\n')}`).join('\n\n')
    + '\n\n' + t`Zum Abhaken öffnen:` + `\n${appAdresse()}#l=${await kodiere(snap)}`;
  teile(text, t`Liste teilen`);
}

async function teile(text, titel) {
  if (navigator.share) {
    try { await navigator.share({ text }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  // Safari verlangt fürs Teilen ein frisches Antippen; dann über ein Blatt mit eigenem Knopf
  const b = oeffneBlatt(`<div class="blatt-kopf"><h3>${esc(titel)}</h3><button type="button" class="zurueck" data-schliessen>${t`Fertig`}</button></div>
    <textarea class="teilen-text" readonly>${esc(text)}</textarea>
    <div class="knopfreihe">
      ${navigator.share ? `<button type="button" class="knopf" id="tTeilen">${t`Teilen`}</button>` : ''}
      <button type="button" class="knopf zweit" id="tKopieren">${t`Kopieren`}</button>
    </div>`);
  b.addEventListener('click', async e => {
    if (e.target.closest('#tTeilen')) { try { await navigator.share({ text }); schliesseBlatt(b); } catch (x) {} }
    if (e.target.closest('#tKopieren')) {
      try { await navigator.clipboard.writeText(text); } catch (x) { $('.teilen-text', b).select(); document.execCommand('copy'); }
      schliesseBlatt(b); zeigeToast(t`Kopiert, jetzt in eine Nachricht einfügen`);
    }
  });
}

function linkAusAdresse() {
  const link = linkAus(location.hash);
  if (!link) return;
  history.replaceState(null, '', location.pathname + location.search);
  verarbeiteLink(link);
}

async function verarbeiteLink(link) {
  if (link.art === 's') return oeffneBeitreten(link.daten);
  let daten;
  try { daten = await dekodiere(link.daten); } catch (e) { return zeigeToast(t`Der Link ist unvollständig oder beschädigt`); }
  if (!daten || daten.v !== 1) return zeigeToast(t`Der Link stammt aus einer neueren Version der App`);
  if (link.art === 'l') oeffneGeteilt(daten);
  else oeffneRueckmeldung(daten);
}

function oeffneGeteilt(snap) {
  if (!Array.isArray(snap.a)) return zeigeToast(t`Der Link ist unvollständig oder beschädigt`);
  if (S.geteilt && S.geteilt.id === snap.id) return render();  // derselbe Link noch einmal: Häkchen bleiben
  if (S.geteilt && S.geteilt.artikel.some(i => i.erledigt)
    && !confirm(t`Es ist schon eine geteilte Liste mit abgehakten Artikeln offen. Durch die neue ersetzen?`)) return;
  S.geteilt = { id: String(snap.id), t: snap.t, artikel: snap.a.map(ausZeile) };
  sichere('geteilt', S.geteilt);
  render();
  scrollTo(0, 0);
}

function renderGeteilt() {
  const g = S.geteilt, n = g.artikel.length, erledigt = g.artikel.filter(i => i.erledigt).length;
  const datum = g.t ? ' · ' + t`geteilt am ${new Date(g.t).toLocaleDateString(gebietsschema(), { day: 'numeric', month: 'numeric', year: 'numeric' })}` : '';
  $('#geteiltInfo').textContent = t`${n} Artikel` + datum;

    || `<div class="leer">${t`Die geteilte Liste ist leer.`}</div>`;
  $('#btnAbschluss').textContent = t`Erledigt zurückschicken · ${erledigt} von ${n}`;
  renderUnten(n > 0, false);
}

function geteiltAbhaken(item) {
  item.erledigt = !item.erledigt;
  item.erledigtUm = item.erledigt ? Date.now() : null;
  sichere('geteilt', S.geteilt);
  render();
}

function geteiltSchliessen() {
  if (!confirm(t`Geteilte Liste schließen? Die Häkchen gehen verloren. Schicke vorher die Rückmeldung, falls noch nicht geschehen.`)) return;
  S.geteilt = null;
  sichere('geteilt', null);
  render();
}

async function rueckmeldungSchicken() {
  const g = S.geteilt;
  const gekauft = g.artikel.filter(i => i.erledigt), fehlt = g.artikel.filter(i => !i.erledigt);
  const r = { v: 1, id: g.id, g: gekauft.map(i => i.id), n: fehlt.map(i => i.id) };
  const text = t`Einkauf erledigt: ${gekauft.length} von ${g.artikel.length} Artikeln` + '\n'
    + (fehlt.length ? '\n' + t`Nicht bekommen:` + `\n${fehlt.map(i => '- ' + artikelText(i)).join('\n')}\n` : '')
    + '\n' + t`In die Liste übernehmen:` + `\n${appAdresse()}#r=${await kodiere(r)}`;
  teile(text, t`Rückmeldung schicken`);
}

function rueckmeldungAuswerten(r) {
  const g = new Set((r.g || []).map(String)), n = new Set((r.n || []).map(String));
  const gekauft = S.liste.filter(i => g.has(i.id)), fehlt = S.liste.filter(i => n.has(i.id));
  return { gekauft, fehlt, offen: gekauft.filter(i => !i.erledigt), unbekannt: g.size + n.size - gekauft.length - fehlt.length };
}

function rueckmeldungAnwenden(items) {
  const jetzt = Date.now();
  for (const i of items) { i.erledigt = true; i.erledigtUm = jetzt; }
  sichereListe(); render();
}

function oeffneRueckmeldung(r) {
  const { gekauft, fehlt, offen, unbekannt } = rueckmeldungAuswerten(r);
  const homescreen = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const namen = l => l.map(i => esc(i.name)).join(', ');
  const b = oeffneBlatt(`<div class="blatt-kopf"><h3>${t`Rückmeldung`}</h3><button type="button" class="zurueck" data-schliessen>${t`Abbrechen`}</button></div>
    <p>${t`${(r.g || []).length} gekauft, ${(r.n || []).length} nicht bekommen.`}</p>
    ${gekauft.length ? `<div class="abschnitt">${t`Gekauft`}</div><p>${namen(gekauft)}</p>` : ''}
    ${fehlt.length ? `<div class="abschnitt">${t`Nicht bekommen (bleibt offen)`}</div><p>${namen(fehlt)}</p>` : ''}
    ${unbekannt ? `<p class="text-muted">${unbekannt === 1 ? t`1 Artikel steht nicht mehr auf dieser Liste.` : t`${unbekannt} Artikel stehen nicht mehr auf dieser Liste.`}</p>` : ''}
    ${homescreen ? '' : `<p class="text-muted">${t`Nutzt du die App vom Home-Bildschirm? Dann kopiere den Link aus der Nachricht und füge ihn dort ins Eingabefeld ein. Safari und die App haben getrennte Listen.`}</p>`}
    <div class="knopfreihe"><button type="button" class="knopf" id="rmOk"${offen.length ? '' : ' disabled'}>${offen.length ? t`${offen.length} als gekauft abhaken` : t`Nichts abzuhaken`}</button></div>`);
  b.addEventListener('click', e => {
    if (!e.target.closest('#rmOk')) return;
    rueckmeldungAnwenden(offen);
    schliesseBlatt(b);
    zeigeToast(t`${offen.length} abgehakt`, t`Rückgängig`, () => {
      for (const i of offen) { i.erledigt = false; i.erledigtUm = null; }
      sichereListe(); render();
    });
  });
}

/* ============================================================
   Synchronisierung für den Haushalt (#s=…)
   Kein Konto: Wer den geheimen Schlüssel hat, gehört dazu. Aus dem Schlüssel entstehen die Raum-ID (für den Server)
   und der AES-Schlüssel; der Server speichert nur einen verschlüsselten Block mit Versionsnummer.
   Zusammengeführt wird hier: Jedes Feld eines Eintrags trägt einen Zeitstempel, der jüngere gewinnt.
   Dokument: { sammlung: { schlüssel: { f: { feld: [wert, t] | [t] (Feld entfernt) }, x: t (gelöscht) } } }
   ============================================================ */

const SYNC_URL_STANDARD = 'https://einkaufsliste-sync.56nr5tc89d.workers.dev';   // Worker-Adresse, siehe server/ANLEITUNG.md; zum Testen überschreibbar mit localStorage „ek.syncUrl“
const SYNC_URL = (() => { try { return localStorage.getItem('ek.syncUrl') || SYNC_URL_STANDARD; } catch (e) { return SYNC_URL_STANDARD; } })().replace(/\/+$/, '');
const SYNC_SAMMLUNGEN = ['liste', 'verlauf', 'korrekturen', 'eans', 'profile', 'rezepte', 'karten', 'geraete'];
const SYNC_LISTEN = ['liste', 'profile', 'rezepte', 'karten'];      // Arrays mit id, der Rest sind Objekte mit Schlüssel
const SYNC_GRABSTEIN_TAGE = 60;
const SYNC = { stand: null, doc: null, laeuft: false, nochmal: false, zeitgeber: null, fehler: '', online: true };

function ladeSync() {
  SYNC_BEREIT = true;
  SYNC.stand = lade('sync', null);                         // { schluessel, version, serverHash, uhr, zuletzt }
  SYNC.doc = SYNC.stand ? lade('sync.doc', {}) : null;
}
const syncAn = () => !!(SYNC.stand && SYNC.stand.schluessel);
function sichereSync() {
  sichere('sync', SYNC.stand);
  sichere('sync.doc', SYNC.doc);
}

// JSON mit sortierten Schlüsseln, damit gleiche Stände auf allen Geräten gleich aussehen
function kanonisch(x) {
  if (Array.isArray(x)) return '[' + x.map(kanonisch).join(',') + ']';
  if (x && typeof x === 'object') return '{' + Object.keys(x).filter(k => x[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + kanonisch(x[k])).join(',') + '}';
  return JSON.stringify(x === undefined ? null : x);
}
function textHash(s) {   // FNV-1a, reicht zum Erkennen von Änderungen
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36) + ':' + s.length;
}

// Hybride Uhr: nie kleiner als ein schon gesehener Zeitstempel, damit eine nachgehende Geräteuhr nicht verliert
function syncUhr(stand) {
  const t = Math.max(Date.now(), (stand.uhr || 0) + 1);
  stand.uhr = t;
  return t;
}

// Sammlung als { schlüssel: wert } (Arrays über die id)
const alsMap = (name, wert) => SYNC_LISTEN.includes(name) ? Object.fromEntries((wert || []).map(e => [e.id, e])) : (wert || {});
const istObjekt = v => v && typeof v === 'object' && !Array.isArray(v);
const felderVon = v => istObjekt(v) ? v : { _: v };
// Ein Eintrag lebt, wenn er Werte hat und ein Feld jünger ist als sein Löschzeitpunkt.
// So bleibt ein Artikel vollständig erhalten, wenn jemand ihn löscht und ein anderer ihn gleichzeitig ändert.
const juengstes = e => Math.max(0, ...Object.values(e.f || {}).map(w => w.at(-1)));
const lebt = e => !!e && Object.values(e.f || {}).some(w => w.length === 2) && juengstes(e) > (e.x || 0);

// Überträgt den aktuellen Stand einer Sammlung ins Dokument; geänderte Felder bekommen den Zeitstempel t
function erfasse(doc, name, wert, t) {
  const alt = doc[name] || (doc[name] = {});
  const jetzt = alsMap(name, wert);
  let geaendert = false;
  for (const [key, v] of Object.entries(jetzt)) {
    const e = alt[key] || (alt[key] = { f: {} });
    const felder = felderVon(v);
    for (const [feld, fw] of Object.entries(felder)) {
      if (fw === undefined) continue;
      const bisher = e.f[feld];
      if (!bisher || bisher.length === 1 || kanonisch(bisher[0]) !== kanonisch(fw)) { e.f[feld] = [JSON.parse(JSON.stringify(fw)), t]; geaendert = true; }
    }
    for (const [feld, bisher] of Object.entries(e.f)) {
      if (bisher.length === 2 && !(feld in felder && felder[feld] !== undefined)) { e.f[feld] = [t]; geaendert = true; }
    }
  }
  for (const [key, e] of Object.entries(alt)) {
    if (!(key in jetzt) && lebt(e)) { alt[key] = { f: {}, x: t }; geaendert = true; }
  }
  return geaendert;
}

// Führt zwei Dokumente zusammen (reine Funktion). Pro Feld gewinnt der jüngere Zeitstempel,
// bei Gleichstand der größere Wert, damit alle Geräte zum selben Ergebnis kommen.
function zusammenfuehren(a, b, jetzt = Date.now()) {
  const erg = {}, grenze = jetzt - SYNC_GRABSTEIN_TAGE * 864e5;
  for (const name of new Set([...Object.keys(a || {}), ...Object.keys(b || {})])) {
    const sa = (a || {})[name] || {}, sb = (b || {})[name] || {}, ziel = erg[name] = {};
    for (const key of new Set([...Object.keys(sa), ...Object.keys(sb)])) {
      const ea = sa[key] || { f: {} }, eb = sb[key] || { f: {} };
      const x = Math.max(ea.x || 0, eb.x || 0);
      const f = {};
      for (const feld of new Set([...Object.keys(ea.f || {}), ...Object.keys(eb.f || {})])) {
        const va = (ea.f || {})[feld], vb = (eb.f || {})[feld];
        let w = !va ? vb : !vb ? va : va.at(-1) !== vb.at(-1) ? (va.at(-1) > vb.at(-1) ? va : vb)
          : kanonisch(va) >= kanonisch(vb) ? va : vb;
        f[feld] = w;
      }
      const neu = x ? { f, x } : { f };
      if (x && !lebt(neu)) {
        if (x >= grenze) ziel[key] = { f: {}, x };   // Grabstein; alte fallen weg
        continue;
      }
      if (Object.keys(f).length) ziel[key] = neu;
    }
  }
  return erg;
}

// Wert eines Eintrags aus dem Dokument; null = gelöscht
function eintragWert(e) {
  if (!lebt(e)) return null;
  if ('_' in e.f) return e.f._.length === 2 ? e.f._[0] : null;
  return Object.fromEntries(Object.entries(e.f).filter(([, w]) => w.length === 2).map(([k, w]) => [k, JSON.parse(JSON.stringify(w[0]))]));
}
const ersterZeitstempel = e => Math.min(...Object.values(e.f || {}).map(w => w.at(-1)));

// Schreibt das Dokument in eine Sammlung zurück. Vorhandene Objekte werden an Ort und Stelle geändert,
// damit offene Blätter (z. B. das Detailblatt eines Artikels) weiter auf dasselbe Objekt zeigen.
function ausDokument(doc, name, bisher) {
  const s = doc[name] || {};
  const angleichen = (obj, wert) => {
    if (!istObjekt(obj) || !istObjekt(wert)) return wert;
    for (const k of Object.keys(obj)) if (!(k in wert)) delete obj[k];
    return Object.assign(obj, wert);
  };
  if (SYNC_LISTEN.includes(name)) {
    const alt = new Map((bisher || []).map(e => [e.id, e]));
    const erg = [];
    for (const e of bisher || []) {
      const w = eintragWert(s[e.id]);
      if (w) erg.push(angleichen(e, { ...w, id: e.id }));
    }
    const neu = Object.entries(s).filter(([k, e]) => !alt.has(k) && eintragWert(e)).sort((x, y) => ersterZeitstempel(x[1]) - ersterZeitstempel(y[1]));
    for (const [k, e] of neu) erg.push({ ...eintragWert(e), id: k });
    return erg;
  }
  const erg = {};
  for (const [k, e] of Object.entries(s)) {
    const w = eintragWert(e);
    if (w != null) erg[k] = angleichen((bisher || {})[k], w);
  }
  return erg;
}

/* Verschlüsselung */
async function syncSchluessel(schluessel) {
  const roh = new TextEncoder().encode(schluessel);
  const raum = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('raum|' + schluessel))));
  const basis = await crypto.subtle.importKey('raw', roh, 'HKDF', false, ['deriveKey']);
  const aes = await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new TextEncoder().encode('einkaufsliste'), info: new TextEncoder().encode('daten') },
    basis, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  return { raum, aes };
}
async function verschluessele(obj, aes) {
  const roh = new TextEncoder().encode(JSON.stringify(obj));
  const komp = typeof CompressionStream !== 'undefined';
  const inhalt = komp ? await durchStrom(roh, new CompressionStream('deflate-raw')) : roh;
  const klar = new Uint8Array(inhalt.length + 1);
  klar[0] = komp ? 1 : 0; klar.set(inhalt, 1);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const geheim = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aes, klar));
  const alles = new Uint8Array(12 + geheim.length);
  alles.set(iv); alles.set(geheim, 12);
  return b64url(alles);
}
async function entschluessele(text, aes) {
  const alles = ausB64url(text);
  const klar = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: alles.subarray(0, 12) }, aes, alles.subarray(12)));
  const inhalt = klar.subarray(1);
  const roh = klar[0] === 1 ? await durchStrom(inhalt, new DecompressionStream('deflate-raw')) : inhalt;
  return JSON.parse(new TextDecoder().decode(roh));
}
const neuerSyncSchluessel = () => b64url(crypto.getRandomValues(new Uint8Array(16)));

/* Server */
async function syncAnfrage(methode, raum, body, parameter = '') {
  const ctrl = new AbortController();
  const zeit = setTimeout(() => ctrl.abort(), 12000);
  try {
    const r = await fetch(`${SYNC_URL}/r/${raum}${parameter}`, {
      method: methode, signal: ctrl.signal, cache: 'no-store',
      headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined,
    });
    const d = r.status === 204 ? {} : await r.json().catch(() => ({}));
    return { status: r.status, ...d };
  } finally { clearTimeout(zeit); }
}

/* Lokale Änderungen: wird von sichere() für jede synchronisierte Sammlung aufgerufen */
function syncGeaendert(name) {
  if (!SYNC_SAMMLUNGEN.includes(name) || !syncAn() || SYNC.anwenden) return;
  if (erfasse(SYNC.doc, name, S[name], syncUhr(SYNC.stand))) {
    sichereSync();
    planeSync(1500);
  }
}
function planeSync(ms) {
  clearTimeout(SYNC.zeitgeber);
  SYNC.zeitgeber = setTimeout(() => synchronisiere().catch(() => {}), ms);
}

// Übernimmt ein zusammengeführtes Dokument in die App
function syncAnwenden(doc) {
  const vorher = kanonisch(SYNC.doc);
  SYNC.doc = doc;
  if (kanonisch(doc) === vorher) return false;
  SYNC.anwenden = true;
  try {
    for (const name of SYNC_SAMMLUNGEN) {
      S[name] = ausDokument(doc, name, S[name]);
      sichere(name, S[name]);
    }
    if (!S.profile.length) S.profile = standardProfile();
    if (!S.profile.some(p => p.id === S.aktivesProfil)) { S.aktivesProfil = S.profile[0].id; sichere('aktivesProfil', S.aktivesProfil); }
  } finally { SYNC.anwenden = false; }
  return true;
}

// Holen, zusammenführen, bei Bedarf hochladen. Bei 409 (jemand war schneller) noch einmal.
async function synchronisiere() {
  if (!syncAn() || !SYNC_URL) return;
  if (SYNC.laeuft) { SYNC.nochmal = true; return; }
  SYNC.laeuft = true;
  const st = SYNC.stand;
  const warVerbunden = !!st.zuletzt;                 // beim Einrichten und Beitreten keine Hinweise
  const offenVorher = S.liste.filter(i => !i.erledigt);
  let geaendert = false;
  try {
    meldeGeraet(st);
    const { raum, aes } = await syncSchluessel(st.schluessel);
    for (let versuch = 0; versuch < 4; versuch++) {
      const r = await syncAnfrage('GET', raum, null, st.version ? `?v=${st.version}` : '');
      let serverDoc = null;
      if (r.status === 404) {
        if (st.version) { beendeSync(); zeigeToast(t`Die gemeinsame Liste wurde beendet oder neu eingerichtet`); return; }
      } else if (r.status !== 200) throw new Error('status ' + r.status);
      else if (!r.unveraendert) {
        serverDoc = await entschluessele(r.daten, aes);
        const neu = zusammenfuehren(SYNC.doc, serverDoc);
        for (const s of Object.values(serverDoc)) for (const e of Object.values(s)) for (const w of Object.values(e.f || {}).concat(e.x ? [[e.x]] : [])) st.uhr = Math.max(st.uhr || 0, w.at(-1));
        if (syncAnwenden(neu)) {
          geaendert = true;
          if (GERAET_ALT && S.geraete[GERAET_ALT]) meldeGeraet(st, Date.now(), true);   // eigenen alten Namen entfernen
          const zusammen = fasseDoppelteZusammen(S.liste);
          if (zusammen) { S.liste = zusammen; sichereListe(); }   // wird gleich mit hochgeladen
        }
        st.version = r.version; st.serverHash = textHash(kanonisch(serverDoc));
      }
      const hash = textHash(kanonisch(SYNC.doc));
      if (r.status === 200 && hash === st.serverHash) break;            // Server kennt schon alles
      const p = await syncAnfrage('PUT', raum, { basis: r.status === 404 ? 0 : st.version, daten: await verschluessele(SYNC.doc, aes) });
      if (p.status === 200) { st.version = p.version; st.serverHash = hash; break; }
      if (p.status !== 409) throw new Error('status ' + p.status);
    }
    st.zuletzt = Date.now(); SYNC.fehler = ''; SYNC.online = true;
    sichereSync();
    if (geaendert && warVerbunden) meldeFremdesLoeschen(offenVorher);
  } catch (e) {
    const netz = navigator.onLine === false || e.name === 'AbortError' || e instanceof TypeError;
    SYNC.online = !netz;
    SYNC.fehler = netz ? '' : e.name === 'OperationError' ? t`Schlüssel passt nicht zu den Daten` : t`Synchronisierung fehlgeschlagen`;
  } finally {
    SYNC.laeuft = false;
    if (geaendert) render();
    document.dispatchEvent(new Event('sync'));
    if (SYNC.nochmal) { SYNC.nochmal = false; planeSync(300); }
  }
}

// Hinweis, wenn ein anderes Gerät offene Artikel gelöscht hat (nicht bei „Einkauf abschließen“, das nur Abgehaktes
// entfernt, und nicht, wenn nur Doppelte zusammengefasst wurden). „Rückgängig“ holt sie für alle zurück.
function meldeFremdesLoeschen(offenVorher) {
  const offenJetzt = new Set(S.liste.filter(i => !i.erledigt).map(i => kompakt(i.name)));
  const weg = offenVorher.filter(i => !S.liste.includes(i) && !offenJetzt.has(kompakt(i.name)));
  if (!weg.length) return;
  zeigeToast(weg.length === 1 ? t`${weg[0].name} auf einem anderen Gerät gelöscht` : t`${weg.length} Artikel auf einem anderen Gerät gelöscht`,
    t`Rückgängig`, () => { S.liste.push(...weg); sichereListe(); render(); });
}

// modus: 'neu' (erstes Gerät), 'zusammen' (beitreten, eigene Daten behalten), 'ersetzen' (beitreten, nur gemeinsame Daten)
async function starteSync(schluessel, modus) {
  if (modus === 'zusammen') await entferneLokaleDoppelte(schluessel);
  SYNC.stand = { schluessel, version: 0, serverHash: '', uhr: 0, zuletzt: 0 };
  SYNC.doc = {};
  S.geraete = {};     // Geräteliste gehört zum Haushalt; dieses Gerät trägt sich beim ersten Abgleich ein
  if (modus !== 'ersetzen') {
    // Beim Beitreten gewinnt bei gleichen Einträgen der gemeinsame Stand (Zeitstempel 1), Neues von hier kommt dazu
    const t0 = modus === 'zusammen' ? 1 : syncUhr(SYNC.stand);
    for (const name of SYNC_SAMMLUNGEN) erfasse(SYNC.doc, name, S[name], t0);
  }
  sichereSync();
  zaehleNutzung();
  await synchronisiere();
}

// Vor dem Beitreten: Artikel, die schon offen auf der gemeinsamen Liste stehen, hier entfernen,
// damit „Milch“ nicht doppelt erscheint. Die gemeinsame Fassung bleibt.
async function entferneLokaleDoppelte(schluessel) {
  try {
    const { raum, aes } = await syncSchluessel(schluessel);
    const r = await syncAnfrage('GET', raum);
    if (r.status !== 200) return;
    const gemeinsam = ausDokument(await entschluessele(r.daten, aes), 'liste', []);
    const namen = new Set(gemeinsam.filter(i => !i.erledigt).map(i => kompakt(i.name)));
    const vorher = S.liste.length;
    S.liste = S.liste.filter(i => i.erledigt || !namen.has(kompakt(i.name)));
    if (S.liste.length !== vorher) sichereListe();
  } catch (e) {}
}

function beendeSync() {
  clearTimeout(SYNC.zeitgeber);
  SYNC.stand = null; SYNC.doc = null; SYNC.fehler = ''; SYNC.abmelden = false;
  S.geraete = {}; sichere('geraete', S.geraete);
  try { localStorage.removeItem(SPEICHER_PREFIX + 'sync'); localStorage.removeItem(SPEICHER_PREFIX + 'sync.doc'); } catch (e) {}
  document.dispatchEvent(new Event('sync'));
}

// Neuer Schlüssel: alter Raum wird gelöscht, die anderen Geräte sind draußen
async function erneuereSync() {
  const { raum } = await syncSchluessel(SYNC.stand.schluessel);
  await syncAnfrage('DELETE', raum).catch(() => {});
  const doc = SYNC.doc;
  SYNC.stand = { schluessel: neuerSyncSchluessel(), version: 0, serverHash: '', uhr: SYNC.stand.uhr, zuletzt: 0 };
  SYNC.doc = doc;
  // Die anderen Geräte sind getrennt: nur dieses bleibt in der Liste
  S.geraete = Object.fromEntries(Object.entries(S.geraete).filter(([code]) => code === GERAET_CODE));
  sichere('geraete', S.geraete);
  sichereSync();
  await synchronisiere();
}

// Zusatz für Rückfragen bei Löschungen, die über die Synchronisierung alle Geräte treffen
const syncWarnung = () => syncAn() ? ' ' + t`Das gilt für alle verbundenen Geräte.` : '';

// Haben zwei Geräte gleichzeitig denselben Artikel eingetragen, steht er nach dem Abgleich zweimal da.
// Zusammenfassen: Es bleibt der Eintrag mit der kleinsten id (auf allen Geräten derselbe), mit der größeren Menge
// bei gleicher Einheit – beide wollten ja dasselbe. Notiz und Stammartikel werden übernommen.
function fasseDoppelteZusammen(liste) {
  const gruppen = new Map();
  for (const i of liste) {
    if (i.erledigt || i.pausiert) continue;
    const k = kompakt(i.name);
    gruppen.set(k, [...(gruppen.get(k) || []), i]);
  }
  const weg = new Set();
  for (const g of gruppen.values()) {
    if (g.length < 2) continue;
    g.sort((a, b) => (a.id < b.id ? -1 : 1));
    const [bleibt, ...rest] = g;
    for (const i of rest) {
      if ((i.einheit || 'stk') === (bleibt.einheit || 'stk')) bleibt.menge = Math.max(bleibt.menge || 1, i.menge || 1);
      if (!bleibt.notiz && i.notiz) bleibt.notiz = i.notiz;
      if (i.stamm) bleibt.stamm = true;
      weg.add(i);
    }
  }
  return weg.size ? liste.filter(i => !weg.has(i)) : null;
}

const einladungsLink = () => `${appAdresse()}#s=${SYNC.stand.schluessel}`;

// rand in Modulen; für Kassenscanner 4 (Ruhezone nach Norm). Reine Ziffern und Großbuchstaben werden dichter kodiert.
function qrSvg(text, rand = 2) {
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  const qr = qrcode(0, 'M');
  qr.addData(text, /^\d+$/.test(text) ? 'Numeric' : /^[0-9A-Z $%*+\-./:]+$/.test(text) ? 'Alphanumeric' : 'Byte'); qr.make();
  const n = qr.getModuleCount();
  let pfad = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (qr.isDark(y, x)) pfad += `M${x + rand} ${y + rand}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" class="qr" viewBox="0 0 ${n + 2 * rand} ${n + 2 * rand}" role="img" aria-label="${t`QR-Code`}"><rect width="100%" height="100%" fill="#fff"/><path d="${pfad}" fill="#000"/></svg>`;
}

function syncStatusText() {
  if (!SYNC_URL) return t`Der Sync-Server ist noch nicht eingerichtet.`;
  if (SYNC.fehler) return SYNC.fehler;
  if (!SYNC.online) return t`Offline. Änderungen werden später übertragen.`;
  const z = SYNC.stand && SYNC.stand.zuletzt;
  if (!z) return t`Noch nicht synchronisiert`;
  const min = Math.round((Date.now() - z) / 60000);
  return min < 1 ? t`Verbunden · gerade eben` : t`Verbunden · zuletzt vor ${min} Min.`;
}

/* Verbundene Geräte
   Jedes Gerät hat einen festen Namen aus zwei Wörtern und einer Zahl („Tiger-Hafen-42“), zufällig beim ersten Start erzeugt
   und nur hier gespeichert. Unter diesem Namen erscheint es auf den anderen Geräten. Beim Abgleich trägt es sich mit Art
   und Zeitpunkt in die Sammlung „geraete“ ein, höchstens alle 5 Minuten, damit nicht ständig hochgeladen wird.
   Die Wörter sind in allen Sprachen dieselben, damit der Name auf jedem Gerät gleich aussieht. 256 × 256 × 90 ≈ 5,9 Mio. Namen. */
const GERAETE_WOERTER = ('adler ahorn ameise amsel anker anzug apfel arena atlas auster bach ball banane bank bart bauer ' +
  'baum beere berg besen biber birke birne blatt blitz blume bohne boot brief brille brot brunnen buch burg butter dach ' +
  'dachs damm dattel decke degen delfin diamant docht dohle dom dorf drache eiche eimer eis elch engel ente erbse esel ' +
  'eule fabrik fackel faden falke farn feder fee feld fels fenster ferse fichte fisch flagge flasche floh flosse flur ' +
  'fluss fohlen forelle frosch fuchs gabel gans garten geige gipfel giraffe glas glocke gold gras griff gurke hafen ' +
  'hagel hahn hai hammer hase haus hecht hecke held helm hemd herd hering hirsch hobel honig horn hose hotel huhn hummel ' +
  'hund hut igel insel jacke jaguar kabel kaffee kahn kakao kaktus kamel kamin kanal kanne kater kerze kessel kiefer ' +
  'kirche kirsche kiste kiwi klee knopf koala koch koffer komet kompass korb kran krone kuchen kugel lachs lampe land ' +
  'laterne lauch leiter lerche linde lotse luchs lupe mais mantel marder maus meer melone messer mond moos motte ' +
  'muschel nadel nagel nashorn nebel nest netz nixe nudel oase ofen olive onkel orange orgel otter paket palme panda ' +
  'papier pauke perle pfanne pfau pferd pflaume pilz pinsel pirat planet posaune puppe quelle rabe rad rahmen rakete ' +
  'regen reh reis riese ring ritter robbe rose rubin ruder saft salz sand sattel schaf schal schiff schloss schnee ' +
  'schuh see segel sessel sonne specht spiegel stern storch strand tanne tasche taube teller tiger tisch topf turm uhr ' +
  'ufer vogel vulkan waage wal wald wiese wolke wolle zebra zelt').split(' ');
const GERAET_MELDEN_MS = 5 * 60e3, GERAET_AKTIV_MS = 15 * 60e3, GERAET_VERGESSEN_TAGE = 60;
const GERAET_MUSTER = /^[A-Z][a-z]+-[A-Z][a-z]+-\d{2}$/;
const geraeteName = (w1, w2, zahl) => [gross(GERAETE_WOERTER[w1]), gross(GERAETE_WOERTER[w2]), 10 + zahl % 90].join('-');
const neuerGeraeteCode = () => { const z = crypto.getRandomValues(new Uint8Array(3)); return geraeteName(z[0], z[1], z[2]); };
// Frühere Fassung: drei Wörter mit Punkten („ruder.sand.kahn“). Daraus derselbe neue Name, der alte wird beim nächsten
// Abgleich aus der Geräteliste entfernt (GERAET_ALT).
const ausAltemCode = alt => { const i = alt.split('.').map(w => GERAETE_WOERTER.indexOf(w)); return i.every(x => x >= 0) ? geraeteName(i[0], i[1], i[2]) : null; };
let GERAET_ALT = null;
const GERAET_CODE = (() => {
  let code = null;
  try { code = localStorage.getItem(SPEICHER_PREFIX + 'geraet'); } catch (e) {}
  if (code && /^[a-z]+\.[a-z]+\.[a-z]+$/.test(code)) { GERAET_ALT = code; code = ausAltemCode(code); }
  if (!code || !GERAET_MUSTER.test(code)) code = neuerGeraeteCode();
  try { localStorage.setItem(SPEICHER_PREFIX + 'geraet', code); } catch (e) {}
  return code;
})();
// Die anderen Geräte im Haushalt, zuletzt aktive zuerst
const andereGeraete = () => Object.entries(S.geraete).filter(([code]) => code !== GERAET_CODE && code !== GERAET_ALT)
  .sort(([, x], [, y]) => (y.gesehen || 0) - (x.gesehen || 0));

function geraeteArt() {
  const ua = navigator.userAgent;
  const art = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad' : /iPhone|iPod/.test(ua) ? 'iPhone'
    : /Android/.test(ua) ? 'Android' : /Macintosh/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : '';
  return { art, app: !!(navigator.standalone || matchMedia('(display-mode: standalone)').matches) };
}

// Beim Abgleich: eigenen Eintrag auffrischen, lange nicht gesehene Geräte vergessen. Direkt ins Dokument,
// ohne sichere() → planeSync, weil der Abgleich gerade ohnehin läuft.
function meldeGeraet(st, jetzt = Date.now(), sofort = false) {
  if (SYNC.abmelden) return;
  const ich = S.geraete[GERAET_CODE], info = geraeteArt();
  const alt = Object.entries(S.geraete).filter(([code, g]) => code !== GERAET_CODE && (code === GERAET_ALT || jetzt - (g.gesehen || 0) > GERAET_VERGESSEN_TAGE * 864e5));
  if (!sofort && ich && jetzt - ich.gesehen < GERAET_MELDEN_MS && ich.art === info.art && ich.app === info.app && !alt.length) return;
  S.geraete = { ...Object.fromEntries(Object.entries(S.geraete).filter(([code]) => !alt.some(([c]) => c === code))),
    [GERAET_CODE]: { ...info, gesehen: jetzt } };
  SYNC.anwenden = true;
  try { sichere('geraete', S.geraete); } finally { SYNC.anwenden = false; }
  erfasse(SYNC.doc, 'geraete', S.geraete, syncUhr(st));
  sichereSync();
}

// „Auf diesem Gerät beenden“: erst aus der Geräteliste austragen (wenn der Server erreichbar ist), dann trennen
async function meldeGeraetAb() {
  if (syncAn() && S.geraete[GERAET_CODE]) {
    SYNC.abmelden = true;
    S.geraete = Object.fromEntries(Object.entries(S.geraete).filter(([code]) => code !== GERAET_CODE && code !== GERAET_ALT));
    sichere('geraete', S.geraete);
    clearTimeout(SYNC.zeitgeber);
    await Promise.race([synchronisiere().catch(() => {}), new Promise(ok => setTimeout(ok, 8000))]);
  }
  beendeSync();
}

function vorWann(ms, jetzt = Date.now()) {
  const d = Math.max(0, jetzt - ms) / 1000;
  const rtf = new Intl.RelativeTimeFormat(gebietsschema(), { numeric: 'auto' });
  if (d < 3600) return rtf.format(-Math.max(1, Math.round(d / 60)), 'minute');
  if (d < 86400) return rtf.format(-Math.round(d / 3600), 'hour');
  if (d < 7 * 86400) return rtf.format(-Math.round(d / 86400), 'day');
  return new Date(ms).toLocaleDateString(gebietsschema(), { day: 'numeric', month: 'numeric', year: 'numeric' });
}

const artText = g => [g.art, g.art ? (g.app ? t`App` : t`Browser`) : ''].filter(Boolean).join(' · ');
function geraeteHTML(jetzt = Date.now()) {
  const andere = andereGeraete();
  return `<div class="abschnitt">${t`Dieses Gerät`}</div>
    <div class="mein-geraet"><span class="status aktiv"></span><div><span class="code">${esc(GERAET_CODE)}</span><small>${esc(artText(geraeteArt()))}</small></div></div>
    <p class="text-muted">${t`Unter diesem Namen erscheint es auf den anderen Geräten.`}</p>
    <div class="abschnitt">${andere.length ? t`Verbunden mit ${andere.length} Geräten` : t`Andere Geräte`}</div>
    ${andere.length ? `<ul class="liste-einst geraete">${andere.map(([code, g]) => {
      const aktiv = jetzt - (g.gesehen || 0) < GERAET_AKTIV_MS;
      const wann = aktiv ? t`Gerade aktiv` : t`Zuletzt aktiv ${vorWann(g.gesehen, jetzt)}`;
      return `<li><span class="status${aktiv ? ' aktiv' : ''}"></span><div><span class="code">${esc(code)}</span>
        <small>${esc([artText(g), wann].filter(Boolean).join(' · '))}</small></div></li>`;
    }).join('')}</ul>` : `<p class="text-muted">${t`Noch kein anderes Gerät verbunden. Mit dem QR-Code unten einladen.`}</p>`}
    <p class="text-muted">${t`Safari und die App vom Home-Bildschirm zählen als zwei Geräte.`}</p>`;
}

// Beitreten über einen Link mit #s=
function oeffneBeitreten(schluessel) {
  if (!SYNC_URL) return zeigeToast(t`Der Sync-Server ist noch nicht eingerichtet.`);
  if (syncAn() && SYNC.stand.schluessel === schluessel) return zeigeToast(t`Schon verbunden`);
  const homescreen = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const b = oeffneBlatt(`<div class="blatt-kopf"><h3>${t`Gemeinsame Liste`}</h3><button type="button" class="zurueck" data-schliessen>${t`Abbrechen`}</button></div>
    <p>${t`Mit der gemeinsamen Liste verbinden? Danach sehen alle verbundenen Geräte dieselbe Liste, dieselben Läden und Rezepte.`}</p>
    ${syncAn() ? `<p class="text-muted">${t`Die bisherige Verbindung dieses Geräts wird dabei beendet.`}</p>` : ''}
    ${homescreen ? '' : `<p class="text-muted">${t`Nutzt du die App vom Home-Bildschirm? Dann kopiere den Link aus der Nachricht und füge ihn dort ins Eingabefeld ein. Safari und die App haben getrennte Listen.`}</p>`}
    <div class="knopfreihe">
      <button type="button" class="knopf" id="sbZusammen">${t`Verbinden und zusammenführen`}</button>
      <button type="button" class="knopf zweit" id="sbErsetzen">${t`Verbinden, Daten dieses Geräts ersetzen`}</button>
    </div>
    <p class="text-muted">${t`Zusammenführen behält, was nur auf diesem Gerät steht. Ersetzen übernimmt nur die gemeinsame Liste.`}</p>`);
  b.addEventListener('click', async e => {
    const knopf = e.target.closest('#sbZusammen, #sbErsetzen');
    if (!knopf) return;
    $$('.knopf', b).forEach(k => { k.disabled = true; });
    knopf.innerHTML = '<span class="laedt"></span>' + t`Wird verbunden`;
    if (syncAn()) beendeSync();
    await starteSync(schluessel, knopf.id === 'sbErsetzen' ? 'ersetzen' : 'zusammen');
    schliesseBlatt(b);
    if (!SYNC.stand || !SYNC.stand.zuletzt) { zeigeToast(t`Verbindung fehlgeschlagen. Später erneut versuchen.`); return; }
    zeigeToast(t`Verbunden`);
    render();
  });
}

// Auslöser: Start, zurück in die App, wieder online, alle 10 s solange offen
function starteSyncZeitgeber() {
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { planeSync(100); zaehleNutzung(); } });
  addEventListener('online', () => planeSync(100));
  setInterval(() => { if (document.visibilityState === 'visible' && syncAn()) synchronisiere().catch(() => {}); }, 10000);
  if (syncAn()) planeSync(300);
}

// Nutzungszähler (statistik.html): einmal pro Tag eine zufällige Geräte-ID an den Server, dazu ob Sync an ist.
// Nicht der Gerätename, keine Listen, nichts sonst. Erneut nur, wenn sich Tag oder Sync-Zustand ändern.
function zaehleNutzung() {
  if (!SYNC_URL || !/\.github\.io$/.test(location.hostname)) return;
  try {
    let id = localStorage.getItem(SPEICHER_PREFIX + 'zaehler');
    if (!/^[A-Za-z0-9_-]{22}$/.test(id || '')) localStorage.setItem(SPEICHER_PREFIX + 'zaehler', id = b64url(crypto.getRandomValues(new Uint8Array(16))));
    const stand = new Date().toISOString().slice(0, 10) + (syncAn() ? '+' : '');
    if (localStorage.getItem(SPEICHER_PREFIX + 'gezaehlt') === stand) return;
    fetch(`${SYNC_URL}/z`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ geraet: id, sync: syncAn() }) })
      .then(r => { if (r.ok) localStorage.setItem(SPEICHER_PREFIX + 'gezaehlt', stand); }).catch(() => {});
  } catch (e) {}
}
